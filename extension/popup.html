<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #18202b; --muted: #5a6574; --line: #d6dce4; --accent: #2443c4; --ok: #1d7a46; --warn: #a8640a; --bad: #c0352b; }
  body { margin: 0; width: 300px; font: 14px/1.5 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; color: var(--ink); }
  header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 16px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  main { padding: 12px 14px; display: grid; gap: 8px; }
  button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-align: left; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .k { font-size: 12px; color: var(--muted); }
  #status { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: #f3f5f8; min-height: 20px; }
  #status.ok { color: var(--ok); } #status.warn { color: var(--warn); } #status.bad { color: var(--bad); }
  footer { padding: 0 14px 12px; font-size: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header><h1>淘寶訂單截圖</h1><p>只截訂單範圍，訂單資料會一併寫入圖片。</p></header>
<main>
  <button class="primary" id="one">截取這張訂單 <span class="k">Alt+Shift+S</span></button>
  <button id="all">截取全部訂單分頁</button>
  <div id="status">打開淘寶「訂單詳情」頁後按上面的按鈕。</div>
</main>
<footer>截圖會存到「下載／淘寶訂單」資料夾。之後在 <a href="https://edwardyungch.github.io/purchase-form/" target="_blank">購物記錄表助手</a> 上載。</footer>
<script src="popup.js"></script>
</body>
</html>
