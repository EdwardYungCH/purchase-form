name: 下載程式庫到 vendor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/vendor.mjs'
      - '.github/workflows/vendor.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 下載 npm 套件
        run: |
          mkdir -p /tmp/v && cd /tmp/v && npm init -y >/dev/null
          npm install --no-audit --no-fund tesseract.js@5.1.1 tesseract.js-core@5.1.1 opencc-js@1.0.5 pdfjs-dist@3.11.174 jspdf@2.5.1
          npm install --no-audit --no-fund @fontsource/lxgw-wenkai-tc || echo "字型套件下載失敗，會改用 Google Fonts"
      - name: 複製到 vendor/
        run: node tools/vendor.mjs /tmp/v/node_modules
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then echo "沒有變更"; else git commit -m "更新 vendor 程式庫" && git push; fi
